name: CI - PR Check

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Job phụ, KHÔNG phải check bắt buộc — chỉ để biết PR có đụng tới backend không.
  # Chạy qua GitHub API nên không cần checkout, xong trong vài giây.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      # Danh sách path bám theo đúng thứ lọt vào image: stage `pruner` chạy
      # `turbo prune @cafe-music/backend` nên chỉ backend + shared + manifest gốc
      # mới đổi được output. pnpm-lock.yaml nằm trong danh sách vì đổi dependency
      # của web cũng đổi lockfile → thà build thừa còn hơn bỏ sót.
      - name: Detect backend-related changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci-pr.yml'

  ci:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lấy từ packageManager field trong package.json tự động

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      - name: Lint
        run: pnpm turbo lint
        env:
          CI: true

      # `test:cov` chứ không phải `test:unit`: chạy đúng bộ test đó nhưng kèm
      # `--coverage`, nên ngưỡng `coverageThreshold` trong jest.config.ts mới
      # thật sự được kiểm. Trước đây step này chạy `test:unit` (không coverage)
      # nên ngưỡng nằm chết trong config và step upload dưới đây upload thư mục
      # rỗng. KHÔNG đổi tên job "Lint + Unit Tests" — đó là required status check.
      - name: Unit Tests + Coverage - Backend + Frontend
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            apps/backend/coverage/
            apps/web/coverage/
            packages/shared/coverage/
          retention-days: 7

  # Tách job riêng để không đổi tên check bắt buộc "Lint + Unit Tests"
  quality:
    name: Typecheck + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc cần type của @prisma/client nên phải generate trước
      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      - name: Typecheck
        run: pnpm turbo typecheck
        env:
          CI: true

      - name: Build
        run: pnpm turbo build
        env:
          CI: true

  # Image này là thứ được deploy lên Railway — hỏng ở đây thì hỏng cả deploy
  docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: changes
    # KHÔNG đặt `if:` ở cấp job và KHÔNG đổi tên job: đây là required status check.
    # Job phải luôn chạy và luôn kết thúc Success, chỉ các step nặng mới gate bằng `if:`.
    env:
      # PR release develop → main luôn build thật, không tin vào filter
      SHOULD_BUILD: ${{ needs.changes.outputs.backend == 'true' || github.base_ref == 'main' }}

    steps:
      - name: Checkout
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bỏ qua build image
        if: env.SHOULD_BUILD != 'true'
        run: echo "PR không đụng apps/backend, packages/shared hay manifest gốc — bỏ qua build image."
