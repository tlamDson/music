name: CI - PR Check

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Job phụ, KHÔNG phải check bắt buộc — chỉ để biết PR có đụng tới backend không.
  # Chạy qua GitHub API nên không cần checkout, xong trong vài giây.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      # Danh sách path bám theo đúng thứ lọt vào image: stage `pruner` chạy
      # `turbo prune @cafe-music/backend` nên chỉ backend + shared + manifest gốc
      # mới đổi được output. pnpm-lock.yaml nằm trong danh sách vì đổi dependency
      # của web cũng đổi lockfile → thà build thừa còn hơn bỏ sót.
      - name: Detect backend-related changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci-pr.yml'

  ci:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lấy từ packageManager field trong package.json tự động

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # KHÔNG dùng `cache: pnpm` ở đây — cache pnpm store được quản lý
          # tường minh bằng actions/cache bên dưới để đo được hit/miss và thời
          # gian tiết kiệm thật, thay vì bị setup-node giấu kín bên trong.

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          # Key bám hash của pnpm-lock.yaml: lockfile không đổi → key không đổi
          # → cache còn nguyên. Đổi một dependency là đổi hash → miss đúng 1
          # lần (vẫn phục hồi được phần chung qua restore-keys), các lần sau
          # lại hit ngay.
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        id: install
        run: |
          start=$(date +%s)
          pnpm install --frozen-lockfile
          echo "duration=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # `cache-hit` chỉ là `true` khi khớp ĐÚNG key chính (lockfile y hệt lần
      # trước) — khớp qua `restore-keys` (lockfile đổi nhưng còn phần chung)
      # thì vẫn phục hồi được cache nhưng output này báo `false`, vì đó không
      # phải phép so sánh "cùng lockfile" mà bạn muốn đo.
      # (Lần chạy trước trong PR #101 đã đo miss: 16s — commit này không đổi
      # pnpm-lock.yaml, chờ xem lần chạy này có hit như dự đoán không.)
      - name: Record cache stats
        if: always()
        run: |
          {
            echo "### 📦 pnpm store cache"
            echo
            echo "| Chỉ số | Giá trị |"
            echo "| --- | --- |"
            echo "| Cache hit (khớp đúng lockfile) | ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ có' || '❌ không' }} |"
            echo "| Thời gian \`pnpm install --frozen-lockfile\` | ${{ steps.install.outputs.duration }}s |"
            echo
            echo "So sánh nhanh hơn bao nhiêu giây: đối chiếu dòng này giữa một lần chạy hit và một lần chạy miss (vd PR trước/sau khi đổi \`pnpm-lock.yaml\`) trong tab **Summary** của từng run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      - name: Lint
        run: pnpm turbo lint
        env:
          CI: true

      # `test:cov` chứ không phải `test:unit`: chạy đúng bộ test đó nhưng kèm
      # `--coverage`, nên ngưỡng `coverageThreshold` trong jest.config.ts mới
      # thật sự được kiểm. Trước đây step này chạy `test:unit` (không coverage)
      # nên ngưỡng nằm chết trong config và step upload dưới đây upload thư mục
      # rỗng. KHÔNG đổi tên job "Lint + Unit Tests" — đó là required status check.
      - name: Unit Tests + Coverage - Backend + Frontend
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            apps/backend/coverage/
            apps/web/coverage/
            packages/shared/coverage/
          retention-days: 7

  # Job MỚI, không nằm trong 3 required check — tên ba job kia là định danh
  # required status check phía GitHub, không đổi và không nhét thêm việc vào.
  # Đây là chỗ đầu tiên trong repo dùng `services:`: hai container Postgres +
  # Redis y hệt cặp postgres_test/redis_test trong docker-compose.yml (cùng cổng
  # 5433/6380 nên env.setup.ts của suite dùng nguyên giá trị mặc định, không cần
  # secret hay biến môi trường nào).
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cafe_music_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      # ts-jest resolve TYPE của @cafe-music/shared qua dist/ (package main/types
      # trỏ vào đó) — moduleNameMapper chỉ lo runtime. Local luôn có dist/ sẵn
      # nên thiếu bước build này chỉ lộ ra trên CI: TS2307 ở mọi spec.
      - name: Build shared package
        run: pnpm --filter @cafe-music/shared build

      - name: Integration Tests
        run: pnpm --filter @cafe-music/backend test:integration
        env:
          CI: true

  # Tách job riêng để không đổi tên check bắt buộc "Lint + Unit Tests"
  quality:
    name: Typecheck + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc cần type của @prisma/client nên phải generate trước
      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      - name: Typecheck
        run: pnpm turbo typecheck
        env:
          CI: true

      - name: Build
        run: pnpm turbo build
        env:
          CI: true

  # Image này là thứ được deploy lên Railway — hỏng ở đây thì hỏng cả deploy
  docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: changes
    # KHÔNG đặt `if:` ở cấp job và KHÔNG đổi tên job: đây là required status check.
    # Job phải luôn chạy và luôn kết thúc Success, chỉ các step nặng mới gate bằng `if:`.
    env:
      # PR release develop → main luôn build thật, không tin vào filter
      SHOULD_BUILD: ${{ needs.changes.outputs.backend == 'true' || github.base_ref == 'main' }}

    steps:
      - name: Checkout
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bỏ qua build image
        if: env.SHOULD_BUILD != 'true'
        run: echo "PR không đụng apps/backend, packages/shared hay manifest gốc — bỏ qua build image."
