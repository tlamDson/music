name: CI - Main (Full)

on:
  push:
    branches: [main]

jobs:
  full-ci:
    name: Full CI + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lấy từ packageManager field trong package.json tự động

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bắt buộc trước lint/typecheck/test: các file này dùng type của @prisma/client
      - name: Generate Prisma Client
        run: pnpm --filter @cafe-music/backend prisma:generate

      - name: Lint
        run: pnpm turbo lint
        env:
          CI: true

      - name: Typecheck
        run: pnpm turbo typecheck
        env:
          CI: true

      - name: Build
        run: pnpm turbo build
        env:
          CI: true

      # Kèm --coverage để ngưỡng trong jest.config.ts được kiểm thật, xem
      # giải thích ở ci-pr.yml.
      - name: Unit Tests + Coverage
        run: pnpm turbo test:cov
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main-${{ github.run_id }}
          path: |
            apps/backend/coverage/
            apps/web/coverage/
          retention-days: 14

# Integration + E2E steps sẽ được bật dần khi từng feature có test sẵn sàng.
# Các env vars nhạy cảm (JWT secrets, DB credentials, S3 keys) sẽ dùng
# ${{ secrets.JWT_ACCESS_SECRET }} v.v. - cấu hình tại GitHub repo Settings > Secrets.
