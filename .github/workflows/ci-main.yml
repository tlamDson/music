name: CI - Main (Full)

on:
  push:
    branches: [main]

jobs:
  full-ci:
    name: Full CI + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version lấy từ packageManager field trong package.json tự động

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm turbo test:unit
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main-${{ github.run_id }}
          path: |
            apps/backend/coverage/
            apps/web/coverage/
          retention-days: 14

# Integration + E2E steps sẽ được bật dần khi từng feature có test sẵn sàng.
# Các env vars nhạy cảm (JWT secrets, DB credentials, S3 keys) sẽ dùng
# ${{ secrets.JWT_ACCESS_SECRET }} v.v. - cấu hình tại GitHub repo Settings > Secrets.
